name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. 0.1.0) — creates a draft release, no tag pushed'
        required: true

permissions:
  contents: write

jobs:
  build:
    # Pinned, not macos-latest: the floating label moves between runner
    # images (and their Xcode/Swift) during rollovers, so the same commit
    # could ship from different SDKs. Bump deliberately.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      - name: Resolve version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            V="${GITHUB_REF_NAME#v}"
          else
            V="${{ github.event.inputs.version }}"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Building version: $V"

      - name: Stamp version into Info.plist
        run: |
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${{ steps.ver.outputs.version }}" SonosBar/Resources/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${{ steps.ver.outputs.version }}" SonosBar/Resources/Info.plist

      - name: Select Xcode 26
        run: |
          # Newest Xcode 26.x on the image (not the image's floating default).
          XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          [ -n "$XCODE" ] || { echo "::error::no Xcode 26.x found on runner"; ls -d /Applications/Xcode*.app; exit 1; }
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE"

      - name: Show toolchain
        run: |
          swift --version
          xcodebuild -version

      - name: Run parser tests
        run: ./scripts/run-parser-tests.sh

      - name: Run update-helper tests
        run: ./scripts/test-update-helper.sh

      - name: Import signing certificate (optional)
        id: signing
        env:
          SIGNING_CERT_P12: ${{ secrets.SIGNING_CERT_P12 }}
          SIGNING_CERT_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
          SIGNING_IDENTITY_NAME: ${{ secrets.SIGNING_IDENTITY_NAME }}
        run: |
          # A stable signing identity keeps the app's designated requirement
          # constant across releases, so Local Network permission and the
          # login item survive self-updates. Without the secret we fall back
          # to ad-hoc (new identity per build).
          if [ -z "$SIGNING_CERT_P12" ] || [ -z "$SIGNING_IDENTITY_NAME" ]; then
            echo "::warning::SIGNING_CERT_P12 / SIGNING_IDENTITY_NAME not set — building ad-hoc signed"
            echo "identity=-" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          KC="$RUNNER_TEMP/signing.keychain-db"
          KCPW="$(uuidgen)"
          security create-keychain -p "$KCPW" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KCPW" "$KC"
          echo "$SIGNING_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$SIGNING_CERT_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KCPW" "$KC" > /dev/null
          # Untrusted (self-signed) identities are only found by codesign
          # when their keychain is in the user search list.
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          echo "identity=$SIGNING_IDENTITY_NAME" >> "$GITHUB_OUTPUT"

      - name: Build .app (release)
        env:
          SONOSBAR_SIGN_IDENTITY: ${{ steps.signing.outputs.identity }}
        run: |
          ./scripts/build-app.sh release
          codesign -d -r- build/SonosBar.app

      - name: Package DMG
        env:
          SONOSBAR_VERSION: ${{ steps.ver.outputs.version }}
        run: ./scripts/make-dmg.sh

      - name: Zip .app (update payload)
        run: |
          cd build
          ditto -c -k --keepParent SonosBar.app "SonosBar-${{ steps.ver.outputs.version }}.app.zip"

      - name: Build signed update manifest
        if: github.event_name == 'push'
        env:
          UPDATE_ED_PRIVATE_KEY: ${{ secrets.UPDATE_ED_PRIVATE_KEY }}
        run: |
          V="${{ steps.ver.outputs.version }}"
          SHA=$(shasum -a 256 "build/SonosBar-$V.app.zip" | awk '{print $1}')
          [ -n "$SHA" ] || { echo "::error::empty SHA for update payload"; exit 1; }
          MINOS=$(/usr/libexec/PlistBuddy -c "Print :LSMinimumSystemVersion" build/SonosBar.app/Contents/Info.plist)
          [ -n "$MINOS" ] || { echo "::error::empty minimumSystemVersion for update payload"; exit 1; }
          # Written as one exact byte stream; sign-update.swift signs these
          # raw bytes and UpdateSignature.swift verifies the same bytes, so
          # this file must never be reformatted after this point.
          printf '{"version":"%s","build":"%s","url":"https://github.com/mlaplante/sonosbar/releases/download/v%s/SonosBar-%s.app.zip","sha256":"%s","bundleIdentifier":"app.sonosbar.SonosBar","minimumSystemVersion":"%s","releaseNotesURL":"https://github.com/mlaplante/sonosbar/releases/tag/v%s","pubDate":"%s"}' \
            "$V" "$V" "$V" "$V" "$SHA" "$MINOS" "$V" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > dist/appcast.json
          if [ -n "$UPDATE_ED_PRIVATE_KEY" ]; then
            swift scripts/sign-update.swift dist/appcast.json
          else
            echo "::error::UPDATE_ED_PRIVATE_KEY not set — cannot ship a signed update manifest"
            exit 1
          fi

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v7
        with:
          name: SonosBar-${{ steps.ver.outputs.version }}
          path: |
            dist/SonosBar-*.dmg
            build/SonosBar-*.app.zip

      - name: Create GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v3
        with:
          name: SonosBar ${{ steps.ver.outputs.version }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            Not notarized — on first launch macOS will block it. Open **System Settings › Privacy & Security**, scroll to Security, and click **Open Anyway** (macOS 15+ removed the old right-click → Open bypass).
            macOS 26 (Tahoe) or later. Installed copies update themselves from the signed feed.
          files: |
            dist/SonosBar-${{ steps.ver.outputs.version }}.dmg
            build/SonosBar-${{ steps.ver.outputs.version }}.app.zip
            dist/appcast.json
            dist/appcast.json.sig

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. 0.1.0) — creates a draft release, no tag pushed'
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Resolve version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            V="${GITHUB_REF_NAME#v}"
          else
            V="${{ github.event.inputs.version }}"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Building version: $V"

      - name: Stamp version into Info.plist
        run: |
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${{ steps.ver.outputs.version }}" SonosBar/Resources/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${{ steps.ver.outputs.version }}" SonosBar/Resources/Info.plist

      - name: Select latest Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Show toolchain
        run: |
          swift --version
          xcodebuild -version

      - name: Run parser tests
        run: ./scripts/run-parser-tests.sh

      - name: Run update-helper tests
        run: ./scripts/test-update-helper.sh

      - name: Build .app (release, ad-hoc signed)
        run: ./scripts/build-app.sh release

      - name: Package DMG
        env:
          SONOSBAR_VERSION: ${{ steps.ver.outputs.version }}
        run: ./scripts/make-dmg.sh

      - name: Zip .app (update payload)
        run: |
          cd build
          ditto -c -k --keepParent SonosBar.app "SonosBar-${{ steps.ver.outputs.version }}.app.zip"

      - name: Build signed update manifest
        if: github.event_name == 'push'
        env:
          UPDATE_ED_PRIVATE_KEY: ${{ secrets.UPDATE_ED_PRIVATE_KEY }}
        run: |
          V="${{ steps.ver.outputs.version }}"
          SHA=$(shasum -a 256 "build/SonosBar-$V.app.zip" | awk '{print $1}')
          [ -n "$SHA" ] || { echo "::error::empty SHA for update payload"; exit 1; }
          MINOS=$(/usr/libexec/PlistBuddy -c "Print :LSMinimumSystemVersion" build/SonosBar.app/Contents/Info.plist)
          [ -n "$MINOS" ] || { echo "::error::empty minimumSystemVersion for update payload"; exit 1; }
          # Written as one exact byte stream; sign-update.swift signs these
          # raw bytes and UpdateSignature.swift verifies the same bytes, so
          # this file must never be reformatted after this point.
          printf '{"version":"%s","build":"%s","url":"https://github.com/mlaplante/sonosbar/releases/download/v%s/SonosBar-%s.app.zip","sha256":"%s","bundleIdentifier":"app.sonosbar.SonosBar","minimumSystemVersion":"%s","releaseNotesURL":"https://github.com/mlaplante/sonosbar/releases/tag/v%s","pubDate":"%s"}' \
            "$V" "$V" "$V" "$V" "$SHA" "$MINOS" "$V" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > dist/appcast.json
          if [ -n "$UPDATE_ED_PRIVATE_KEY" ]; then
            swift scripts/sign-update.swift dist/appcast.json
          else
            echo "::error::UPDATE_ED_PRIVATE_KEY not set — cannot ship a signed update manifest"
            exit 1
          fi

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v7
        with:
          name: SonosBar-${{ steps.ver.outputs.version }}
          path: |
            dist/SonosBar-*.dmg
            build/SonosBar-*.app.zip

      - name: Create GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v3
        with:
          name: SonosBar ${{ steps.ver.outputs.version }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            Unsigned build — first launch will require right-click → Open to bypass Gatekeeper.
            macOS 26 (Tahoe) or later.
          files: |
            dist/SonosBar-${{ steps.ver.outputs.version }}.dmg
            build/SonosBar-${{ steps.ver.outputs.version }}.app.zip
            dist/appcast.json
            dist/appcast.json.sig
